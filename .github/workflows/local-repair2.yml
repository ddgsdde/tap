name: Focused repair round two

on:
  push:
    paths:
      - ".github/workflows/local-repair2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: t183-near29-expanded
            task: "183"
            depth: 5
            seed: experiments/medium-repair/t183-near29.json
            free: "0,2,3,4,6,7,8,9,10,11,12,13,14,16,23,25,27,28"
          - name: t057-near36-cone
            task: "057"
            depth: 5
            seed: experiments/medium-repair/t057-near36.json
            free: "0,1,3,4,6,9,11,12,15,16,17,18,20,21,22,23,24,28,32"
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/offline/build.sh
      - name: Focused SAT repair
        shell: bash
        run: |
          REF="$(ls data/latest/netlists/tapeout/task-${{ matrix.task }}-circuit-*.json | head -n1)"
          OUT="offline-results/${{ matrix.name }}"
          python3 tools/offline/local_repair.py \
            --reference "$REF" --seed-candidate "${{ matrix.seed }}" \
            --free-gates "${{ matrix.free }}" --depth ${{ matrix.depth }} \
            --timeout 700 --out-dir "$OUT" || true
          cat "$OUT/result.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.name }}"
          path: "offline-results/${{ matrix.name }}"
          retention-days: 14
